name: Build CleanResources packs

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python tools/build_packs.py
      - uses: actions/upload-artifact@v4
        with:
          name: cleanresources-packs
          path: |
            dist/cleanresources-legacy.zip
            dist/cleanresources-legacy.zip.sha1
            dist/cleanresources-modern.zip
            dist/cleanresources-modern.zip.sha1
            dist/release-manifest.json
            dist/rank-badges-preview.png
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            dist/cleanresources-legacy.zip
            dist/cleanresources-legacy.zip.sha1
            dist/cleanresources-modern.zip
            dist/cleanresources-modern.zip.sha1
            dist/release-manifest.json
            dist/rank-badges-preview.png
